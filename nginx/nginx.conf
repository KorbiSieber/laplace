user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Structured access logs (easy to ship to Loki/ELK later)
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"client":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log json;

    # Rate limiting: 10 req/s per client IP (real IP if behind Cloudflare)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # WebSocket-friendly, but keeps upstream keepalive for normal requests
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
